version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: news-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - JAR_FILE=target/*.jar
    container_name: news-app
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m -Xms256
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./target:/app/target
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongo:
    image: 'mongo:4.4.0-rc8-bionic'
    container_name: 'mongo-news'
    restart: on-failure
    expose:
      - "27017"
    #ports:
      #- "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root1234

  rabbitmq:
    image: 'rabbitmq:3.9.29-management-alpine'
    container_name: 'rabbitmq-news'
    restart: on-failure
    expose:
      - "5672"
    #ports:
      #- "15673:15672"
      #- "5673:5672"
    volumes:
      - rabbitmq-news-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: 1234

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
  rabbitmq-news-data: